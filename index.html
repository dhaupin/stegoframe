<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>StegoFrame</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; overflow: hidden; }
    body {
      background: #08090c;
      color: #b8c4d0;
      font-family: 'DM Mono', 'Fira Code', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c3240; border-radius: 2px; }
    textarea, input, button { font-family: inherit; }
    @keyframes fadeUp  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes shimmer { from{opacity:0.4} to{opacity:0.9} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ═══════════════════════════════════════════════════════════════════════════
// CODEC
// ═══════════════════════════════════════════════════════════════════════════

const _PI = 100_000, _SB = 16, _IB = 12, _MG = 0x534746, _VR = 0x02;
const Enc = Object.freeze({ SVG:"svg", LSB:"lsb" });
const MS  = Object.freeze({ DECODED:"decoded", ENCODED:"encoded", FAILED:"failed", PENDING:"pending" });
const CS  = Object.freeze({ OPEN:"open", CLOSED:"closed", EXPIRED:"expired" });

async function _dk(p,s){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),{name:"PBKDF2"},false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:_PI,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function _ae(txt,p){
  const s=crypto.getRandomValues(new Uint8Array(_SB)),iv=crypto.getRandomValues(new Uint8Array(_IB));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await _dk(p,s),new TextEncoder().encode(txt));
  const o=new Uint8Array(_SB+_IB+ct.byteLength);o.set(s);o.set(iv,_SB);o.set(new Uint8Array(ct),_SB+_IB);return o;
}
async function _ad(d,p){
  try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(_SB,_SB+_IB)},await _dk(p,d.slice(0,_SB)),d.slice(_SB+_IB)));}catch{return null;}
}
function _pk(p){const b=new Uint8Array(8+p.length);b[0]=(_MG>>16)&0xFF;b[1]=(_MG>>8)&0xFF;b[2]=_MG&0xFF;b[3]=_VR;const l=p.length;b[4]=(l>>24)&0xFF;b[5]=(l>>16)&0xFF;b[6]=(l>>8)&0xFF;b[7]=l&0xFF;b.set(p,8);return b;}
function _up(b){if(b.length<8)return null;if(((b[0]<<16)|(b[1]<<8)|b[2])!==_MG||b[3]!==_VR)return null;const l=(b[4]<<24)|(b[5]<<16)|(b[6]<<8)|b[7];return(l>0&&l<=b.length-8)?b.slice(8,8+l):null;}
function _ub(b){let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function _bu(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function _b2B(bits){const b=new Uint8Array(Math.floor(bits.length/8));for(let i=0;i<b.length;i++){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bits[i*8+j];b[i]=v;}return b;}

function lsbWrite(payload){
  const pk=_pk(payload),dim=Math.max(32,Math.ceil(Math.sqrt(pk.length*8)));
  const cv=document.createElement("canvas");cv.width=cv.height=dim;
  const cx=cv.getContext("2d"),im=cx.createImageData(dim,dim);
  crypto.getRandomValues(im.data);for(let i=3;i<im.data.length;i+=4)im.data[i]=255;
  for(let i=0;i<pk.length*8;i++){const bit=(pk[Math.floor(i/8)]>>(7-(i%8)))&1;im.data[i*4]=(im.data[i*4]&0xFE)|bit;}
  cx.putImageData(im,0,0);return cv.toDataURL("image/png");
}
async function lsbRead(url){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const cv=document.createElement("canvas");cv.width=im.width;cv.height=im.height;
      const cx=cv.getContext("2d");cx.drawImage(im,0,0);
      const d=cx.getImageData(0,0,im.width,im.height).data;
      const hb=[];for(let i=0;i<64;i++)hb.push(d[i*4]&1);
      const hdr=_b2B(hb);if(!_up(hdr)){res(null);return;}
      const l=(hdr[4]<<24)|(hdr[5]<<16)|(hdr[6]<<8)|hdr[7],tb=(8+l)*8,ab=[];
      for(let i=0;i<tb;i++)ab.push(d[i*4]&1);res(_up(_b2B(ab)));
    };im.onerror=()=>res(null);im.src=url;
  });
}
function svgWrite(payload){
  const b64=_ub(_pk(payload)),h=Math.floor(Math.random()*360),h2=(h+137)%360;
  const els=Array.from({length:5},(_,i)=>`<circle cx="${(8+Math.random()*84).toFixed(1)}" cy="${(8+Math.random()*84).toFixed(1)}" r="${(2+Math.random()*8).toFixed(1)}" fill="hsla(${(h+i*43)%360},45%,60%,0.1)"/>`).join("");
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><desc data-f="${_VR}" data-p="${b64}"/><defs><radialGradient id="g" cx="42%" cy="42%" r="62%"><stop offset="0%" stop-color="hsl(${h},50%,62%)"/><stop offset="100%" stop-color="hsl(${h2},42%,18%)"/></radialGradient></defs><rect width="100" height="100" fill="url(#g)"/>${els}</svg>`;
  return "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
}
function svgRead(url){
  try{const r=decodeURIComponent(escape(atob(url.split(",")[1]))),m=r.match(/data-p="([A-Za-z0-9+/=]+)"/);return m?_up(_bu(m[1])):null;}catch{return null;}
}

const Codec={
  async encode(txt,pass,mode){const e=await _ae(txt,pass);return mode===Enc.LSB?lsbWrite(e):svgWrite(e);},
  async decode(url,pass){let r=svgRead(url);if(!r)r=await lsbRead(url);if(!r)return null;return _ad(r,pass);},
  sniff(url){if(!url)return null;try{const peek=atob(url.split(",")[1]).slice(0,64);if(peek.includes("<svg"))return Enc.SVG;}catch{}return Enc.LSB;},
};

// ═══════════════════════════════════════════════════════════════════════════
// CHANNEL
// ═══════════════════════════════════════════════════════════════════════════

let _msgN=0;
function makeChannel(pass, enc, ttlMs){
  const id=`ch_${Date.now().toString(36)}`;
  let status=CS.OPEN, _key=pass;
  const msgs=[], evs=new Map(), expiresAt=Date.now()+ttlMs;
  const on=(ev,fn)=>{if(!evs.has(ev))evs.set(ev,[]);evs.get(ev).push(fn);return()=>{const a=evs.get(ev)??[];evs.set(ev,a.filter(f=>f!==fn));};};
  const emit=(ev,d)=>{(evs.get(ev)??[]).forEach(f=>f(d));(evs.get("*")??[]).forEach(f=>f({event:ev,data:d}));};
  function mkMsg(dir,st,enc2,carrier,raw,value,err){
    return{id:`m${++_msgN}_${Date.now().toString(36)}`,dir,status:st,enc:enc2,carrier,raw,value,err,ts:Date.now()};
  }
  const ch={
    id,enc,expiresAt,msgs,on,
    get status(){return status;},
    isOpen:()=>status===CS.OPEN,
    async send(txt){
      if(!ch.isOpen())throw new Error("closed");
      const carrier=await Codec.encode(txt,_key,enc);
      const m=mkMsg("out",MS.ENCODED,enc,carrier,txt,txt,null);
      msgs.push(m);emit("msg",m);return m;
    },
    async receive(url){
      if(!ch.isOpen())throw new Error("closed");
      const raw=await Codec.decode(url,_key);
      const m=mkMsg("in",raw?MS.DECODED:MS.FAILED,Codec.sniff(url)??enc,url,raw,raw,raw?null:"decryption failed — wrong key or no payload");
      msgs.push(m);emit("msg",m);return m;
    },
    close(){status=CS.CLOSED;_key=null;emit("closed",{id});},
  };
  setTimeout(()=>{if(status!==CS.CLOSED){status=CS.EXPIRED;_key=null;emit("expired",{id});}},ttlMs);
  return ch;
}

// ═══════════════════════════════════════════════════════════════════════════
// TOKENS
// ═══════════════════════════════════════════════════════════════════════════

const T={
  bg:"#08090c",surf:"#0e1116",raised:"#13161c",
  b0:"#1e2229",b1:"#2c3240",b2:"#3e4656",
  dim:"#4a5568",muted:"#6b7a8d",sub:"#8899aa",
  txt:"#b8c4d0",bright:"#dce6f0",white:"#f0f5fa",
  green:"#1dff8f",gd:"#071a0f",
  red:"#ff3d5a",rd:"#1a0508",
  amber:"#ffb840",
  blue:"#4db8ff",bd:"#001422",
  out:"#0d1f2d",   // outbound bubble bg
  outB:"#1a3a52",  // outbound bubble border
  inc:"#0f1318",   // inbound bubble bg
  incB:"#1e2229",  // inbound bubble border
};
const MONO="'DM Mono','Fira Code','Courier New',monospace";
const DISP="'Syne',sans-serif";

// ═══════════════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════════════

function wrapB64(s){
  try{const p=atob(s).slice(0,64);if(p.includes("<svg")||p.includes("<?xml"))return"data:image/svg+xml;base64,"+s;}catch{}
  return"data:image/png;base64,"+s;
}
function toDataUrl(s){
  s=s.trim();
  if(s.startsWith("data:"))return s;
  try{atob(s);return wrapB64(s);}catch{}
  return null;
}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}

// ═══════════════════════════════════════════════════════════════════════════
// CARRIER THUMBNAIL  — small, tappable, shows full carrier on expand
// ═══════════════════════════════════════════════════════════════════════════

function CarrierThumb({carrier, enc, onCopy}){
  const [open,setOpen]=useState(false);
  const isSvg=enc===Enc.SVG||carrier?.startsWith("data:image/svg");
  if(!carrier)return null;
  return(
    <>
      <div onClick={()=>setOpen(v=>!v)} title="tap to inspect carrier" style={{
        display:"inline-flex",alignItems:"center",gap:6,marginTop:6,
        cursor:"pointer",opacity:0.7,transition:"opacity 0.15s",
      }}
        onMouseEnter={e=>e.currentTarget.style.opacity=1}
        onMouseLeave={e=>e.currentTarget.style.opacity=0.7}
      >
        <div style={{width:28,height:28,borderRadius:2,overflow:"hidden",border:`1px solid ${T.b1}`,flexShrink:0,background:T.raised}}>
          <img src={carrier} style={{width:"100%",height:"100%",imageRendering:isSvg?"auto":"pixelated",display:"block"}} alt=""/>
        </div>
        <span style={{fontSize:8,color:T.muted,letterSpacing:"0.15em"}}>{isSvg?"SVG":"LSB"} carrier</span>
      </div>

      {open&&(
        <div style={{marginTop:8,background:T.raised,border:`1px solid ${T.b1}`,borderRadius:3,padding:10,animation:"fadeUp 0.2s ease"}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
            <div style={{width:64,height:64,borderRadius:2,overflow:"hidden",border:`1px solid ${T.b1}`,flexShrink:0}}>
              <img src={carrier} style={{width:"100%",height:"100%",imageRendering:isSvg?"auto":"pixelated",display:"block"}} alt="carrier"/>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:8,color:T.muted,letterSpacing:"0.2em",marginBottom:6,textTransform:"uppercase"}}>{isSvg?"svg vector":"lsb raster"}</div>
              <div style={{fontSize:8,color:T.dim,wordBreak:"break-all",lineHeight:1.5,maxHeight:36,overflow:"hidden"}}>
                {carrier.split(",")[1]?.slice(0,60)}…
              </div>
              <div style={{display:"flex",gap:6,marginTop:8}}>
                <button onClick={()=>navigator.clipboard?.writeText(carrier).then(()=>onCopy?.())} style={{
                  background:"transparent",border:`1px solid ${T.b1}`,color:T.sub,
                  padding:"3px 8px",fontSize:8,letterSpacing:"0.15em",cursor:"pointer",borderRadius:2,
                }}>copy url</button>
                <button onClick={()=>{const a=document.createElement("a");a.href=carrier;a.download=`carrier.${isSvg?"svg":"png"}`;a.click();}} style={{
                  background:"transparent",border:`1px solid ${T.b1}`,color:T.sub,
                  padding:"3px 8px",fontSize:8,letterSpacing:"0.15em",cursor:"pointer",borderRadius:2,
                }}>↓ save</button>
                <button onClick={()=>setOpen(false)} style={{
                  background:"transparent",border:"none",color:T.dim,
                  padding:"3px 6px",fontSize:10,cursor:"pointer",marginLeft:"auto",
                }}>✕</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGE BUBBLE
// ═══════════════════════════════════════════════════════════════════════════

function Bubble({msg}){
  const [copied,setCopied]=useState(false);
  const isOut=msg.dir==="out";
  const failed=msg.status===MS.FAILED;

  const bg    = isOut ? T.out : T.inc;
  const border= isOut ? T.outB : T.incB;
  const align = isOut ? "flex-end" : "flex-start";

  const onCopy=()=>{setCopied(true);setTimeout(()=>setCopied(false),1500);};

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:align,marginBottom:12,animation:"fadeUp 0.2s ease"}}>
      <div style={{
        maxWidth:"75%",minWidth:80,
        background:bg,border:`1px solid ${border}`,borderRadius:isOut?"10px 10px 2px 10px":"10px 10px 10px 2px",
        padding:"10px 12px",position:"relative",
      }}>
        {failed?(
          <div style={{fontSize:11,color:T.red,lineHeight:1.6}}>{msg.err}</div>
        ):(
          <>
            <div style={{fontSize:13,color:T.bright,lineHeight:1.7,wordBreak:"break-word",whiteSpace:"pre-wrap"}}>
              {typeof msg.value==="object"?JSON.stringify(msg.value,null,2):msg.value}
            </div>
            <CarrierThumb carrier={msg.carrier} enc={msg.enc} onCopy={onCopy}/>
            {copied&&<div style={{fontSize:8,color:T.green,marginTop:4,letterSpacing:"0.1em"}}>copied ✓</div>}
          </>
        )}
      </div>
      <div style={{fontSize:8,color:T.dim,marginTop:3,letterSpacing:"0.1em",paddingLeft:isOut?0:4,paddingRight:isOut?4:0}}>
        {fmtTime(msg.ts)} · {isOut?"you":"them"} · {(msg.enc||"?").toUpperCase()}
        {failed&&" · failed"}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// CHAT VIEW
// ═══════════════════════════════════════════════════════════════════════════

function ChatView({channel, onClose}){
  const [msgs,setMsgs]      = useState([]);
  const [text,setText]      = useState("");
  const [busy,setBusy]      = useState(false);
  const [dragOver,setDrag]  = useState(false);
  const [now,setNow]        = useState(Date.now());
  const [inputMode,setInputMode] = useState("text"); // "text" | "receive"
  const [pasteInput,setPasteInput] = useState("");
  const bottomRef = useRef();
  const textareaRef = useRef();
  const fileRef = useRef();

  // tick TTL
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t);},[]);

  // subscribe to channel
  useEffect(()=>{
    if(!channel)return;
    setMsgs([...channel.msgs]);
    const u=channel.on("msg",m=>setMsgs(prev=>[...prev,m]));
    return()=>u();
  },[channel]);

  // scroll to bottom on new messages
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs]);

  // global paste listener
  const handlePaste = useCallback(e=>{
    // if typing in textarea, let browser handle it
    if(document.activeElement===textareaRef.current)return;
    const items=Array.from(e.clipboardData?.items??[]);
    const imgItem=items.find(i=>i.type.startsWith("image/"));
    if(imgItem){receiveFile(imgItem.getAsFile());return;}
    const txtItem=items.find(i=>i.kind==="string");
    if(txtItem)txtItem.getAsString(s=>{const u=toDataUrl(s);if(u)receiveUrl(u);});
  },[channel]);

  useEffect(()=>{document.addEventListener("paste",handlePaste);return()=>document.removeEventListener("paste",handlePaste);},[handlePaste]);

  // send outbound
  const send = async()=>{
    const t=text.trim();if(!t||!channel?.isOpen()||busy)return;
    setBusy(true);setText("");
    try{await channel.send(t);}
    finally{setBusy(false);}
  };

  // receive inbound carrier
  const receiveUrl = async(url)=>{
    if(!channel?.isOpen()||!url)return;
    setBusy(true);
    try{await channel.receive(url);}
    finally{setBusy(false);}
  };

  const receiveFile=(file)=>{
    const r=new FileReader();r.onload=e=>receiveUrl(e.target.result);r.readAsDataURL(file);
  };

  const submitPaste=()=>{
    const u=toDataUrl(pasteInput.trim());
    if(u){receiveUrl(u);setPasteInput("");}
  };

  // channel status
  const rem=Math.max(0,channel.expiresAt-now);
  const hh=Math.floor(rem/3600000),mm=Math.floor((rem%3600000)/60000),ss=Math.floor((rem%60000)/1000);
  const ttl=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
  const chOpen=channel.isOpen();
  const statusColor={[CS.OPEN]:T.green,[CS.CLOSED]:T.muted,[CS.EXPIRED]:T.red}[channel.status]??T.muted;

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:T.bg}}>

      {/* ── header ── */}
      <div style={{background:T.raised,borderBottom:`1px solid ${T.b0}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <div style={{fontFamily:DISP,fontSize:15,fontWeight:800,color:T.white,letterSpacing:"0.06em"}}>
          STEGO<span style={{color:T.green}}>FRAME</span>
        </div>
        <div style={{width:1,height:14,background:T.b1}}/>
        <span style={{fontSize:8,color:T.muted,letterSpacing:"0.25em"}}>#{channel.id.slice(-6)}</span>
        <span style={{fontSize:8,color:T.dim,letterSpacing:"0.2em"}}>{channel.enc.toUpperCase()}</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          {/* TTL */}
          <span style={{fontSize:8,color:rem<300000?T.red:T.dim,letterSpacing:"0.15em",fontVariantNumeric:"tabular-nums"}}>
            {ttl}
          </span>
          {/* status dot */}
          <span style={{width:6,height:6,borderRadius:"50%",background:statusColor,display:"inline-block",animation:chOpen?"pulse 2s infinite":"none"}}/>
          {/* close */}
          {chOpen&&(
            <button onClick={onClose} style={{background:"transparent",border:`1px solid ${T.rd}`,color:T.red,padding:"3px 8px",fontSize:8,letterSpacing:"0.15em",cursor:"pointer",borderRadius:2}}>
              close
            </button>
          )}
        </div>
      </div>

      {/* ── thread ── */}
      <div style={{flex:1,overflowY:"auto",padding:"16px 16px 4px",display:"flex",flexDirection:"column"}}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)receiveFile(f);else{const s=e.dataTransfer.getData("text");const u=toDataUrl(s);if(u)receiveUrl(u);}}}
      >
        {dragOver&&(
          <div style={{position:"fixed",inset:0,background:"rgba(29,255,143,0.05)",border:`2px dashed ${T.green}`,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <span style={{fontSize:11,color:T.green,letterSpacing:"0.3em"}}>DROP CARRIER</span>
          </div>
        )}

        {msgs.length===0&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,opacity:0.35}}>
            <div style={{fontSize:10,letterSpacing:"0.3em",color:T.muted}}>NO TRANSMISSIONS</div>
            <div style={{fontSize:8,letterSpacing:"0.2em",color:T.dim}}>type a message or paste a carrier to begin</div>
          </div>
        )}

        {msgs.map(m=><Bubble key={m.id} msg={m}/>)}
        <div ref={bottomRef}/>
      </div>

      {/* ── receive input (expandable) ── */}
      {inputMode==="receive"&&(
        <div style={{padding:"8px 12px",background:T.surf,borderTop:`1px solid ${T.b0}`,flexShrink:0,animation:"fadeUp 0.15s ease"}}>
          <div style={{fontSize:8,color:T.muted,letterSpacing:"0.2em",marginBottom:6,textTransform:"uppercase"}}>paste carrier url or base64</div>
          <div style={{display:"flex",gap:6}}>
            <input
              value={pasteInput} onChange={e=>setPasteInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter")submitPaste();if(e.key==="Escape")setInputMode("text");}}
              placeholder="data:image/... or bare base64"
              autoFocus
              style={{flex:1,background:T.raised,border:`1px solid ${T.b1}`,color:T.bright,padding:"8px 10px",fontSize:11,outline:"none",borderRadius:2}}
            />
            <button onClick={submitPaste} style={{background:T.gd,border:`1px solid ${T.green}`,color:T.green,padding:"0 12px",fontSize:9,letterSpacing:"0.15em",cursor:"pointer",borderRadius:2}}>→</button>
            <button onClick={()=>{setInputMode("text");setPasteInput("");}} style={{background:"transparent",border:`1px solid ${T.b1}`,color:T.muted,padding:"0 10px",fontSize:9,cursor:"pointer",borderRadius:2}}>✕</button>
          </div>
          <div style={{fontSize:8,color:T.dim,marginTop:5,letterSpacing:"0.1em"}}>
            you can also drop a file anywhere on the thread, or paste an image with Ctrl+V / ⌘+V
          </div>
        </div>
      )}

      {/* ── compose bar ── */}
      <div style={{background:T.raised,borderTop:`1px solid ${T.b0}`,padding:"10px 12px",flexShrink:0,display:"flex",gap:8,alignItems:"flex-end"}}>

        {/* attach / receive button */}
        <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
          <button
            onClick={()=>fileRef.current?.click()}
            title="upload carrier file"
            style={{background:"transparent",border:`1px solid ${T.b1}`,color:T.muted,width:34,height:34,cursor:"pointer",borderRadius:2,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}
          >⊕</button>
          <button
            onClick={()=>setInputMode(m=>m==="receive"?"text":"receive")}
            title="paste carrier URL or base64"
            style={{background:inputMode==="receive"?T.gd:"transparent",border:`1px solid ${inputMode==="receive"?T.green:T.b1}`,color:inputMode==="receive"?T.green:T.muted,width:34,height:34,cursor:"pointer",borderRadius:2,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}
          >⌗</button>
        </div>

        <input ref={fileRef} type="file" accept="image/*,.svg" style={{display:"none"}} onChange={e=>{if(e.target.files[0])receiveFile(e.target.files[0]);e.target.value="";}}/>

        {/* text input */}
        <textarea
          ref={textareaRef}
          value={text}
          onChange={e=>{setText(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";}}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder={chOpen?"type a message…":"channel closed"}
          disabled={!chOpen||busy}
          rows={1}
          style={{
            flex:1,background:T.surf,border:`1px solid ${T.b0}`,color:T.bright,
            padding:"9px 12px",fontSize:13,outline:"none",borderRadius:6,
            lineHeight:1.6,resize:"none",minHeight:38,maxHeight:120,overflow:"auto",
          }}
        />

        {/* send */}
        <button
          onClick={send}
          disabled={!text.trim()||!chOpen||busy}
          style={{
            background:(!text.trim()||!chOpen||busy)?T.surf:T.gd,
            border:`1px solid ${(!text.trim()||!chOpen||busy)?T.b1:T.green}`,
            color:(!text.trim()||!chOpen||busy)?T.dim:T.green,
            width:38,height:38,cursor:(!text.trim()||!chOpen||busy)?"not-allowed":"pointer",
            borderRadius:2,fontSize:14,flexShrink:0,transition:"all 0.15s",
            display:"flex",alignItems:"center",justifyContent:"center",
          }}
        >{busy?"…":"↑"}</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// SETUP SCREEN
// ═══════════════════════════════════════════════════════════════════════════

function Setup({onOpen}){
  const [pass,setPass]   = useState("");
  const [enc,setEnc]     = useState(Enc.SVG);
  const [ttl,setTtl]     = useState("4");
  const [err,setErr]     = useState("");
  const [show,setShow]   = useState(false);

  const open=()=>{
    if(!pass.trim()){setErr("passphrase required");return;}
    if(pass.trim().length<4){setErr("at least 4 characters");return;}
    const ms=Math.max(0.1,parseFloat(ttl)||4)*3600000;
    onOpen(makeChannel(pass.trim(),enc,ms));
  };

  return(
    <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:T.bg,padding:20}}>
      <div style={{width:"100%",maxWidth:380}}>

        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{fontFamily:DISP,fontSize:30,fontWeight:800,color:T.white,letterSpacing:"0.06em"}}>
            STEGO<span style={{color:T.green}}>FRAME</span>
          </div>
          <div style={{fontSize:8,color:T.muted,letterSpacing:"0.35em",marginTop:6}}>STEGANOGRAPHIC TRANSPORT</div>
        </div>

        <div style={{background:T.surf,border:`1px solid ${T.b0}`,borderRadius:4,overflow:"hidden"}}>
          <div style={{padding:"11px 16px",borderBottom:`1px solid ${T.b0}`}}>
            <div style={{fontSize:9,letterSpacing:"0.3em",color:T.sub,textTransform:"uppercase"}}>open channel</div>
          </div>
          <div style={{padding:20,display:"flex",flexDirection:"column",gap:16}}>

            {/* passphrase */}
            <div>
              <div style={{fontSize:8,color:T.muted,letterSpacing:"0.25em",textTransform:"uppercase",marginBottom:6}}>passphrase</div>
              <div style={{position:"relative"}}>
                <input
                  type={show?"text":"password"} value={pass}
                  onChange={e=>{setPass(e.target.value);setErr("");}}
                  onKeyDown={e=>{if(e.key==="Enter")open();}}
                  placeholder="shared secret…"
                  autoFocus
                  style={{width:"100%",background:T.raised,border:`1px solid ${err?T.red:T.b1}`,color:T.bright,padding:"9px 44px 9px 12px",fontSize:13,outline:"none",borderRadius:3}}
                />
                <button onClick={()=>setShow(v=>!v)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:9,letterSpacing:"0.1em"}}>
                  {show?"hide":"show"}
                </button>
              </div>
              {err&&<div style={{fontSize:9,color:T.red,marginTop:5}}>{err}</div>}
            </div>

            {/* encoding — fixed per channel */}
            <div>
              <div style={{fontSize:8,color:T.muted,letterSpacing:"0.25em",textTransform:"uppercase",marginBottom:6}}>encoding mode</div>
              <div style={{display:"flex",gap:6}}>
                {[Enc.SVG,Enc.LSB].map(m=>(
                  <button key={m} onClick={()=>setEnc(m)} style={{
                    flex:1,padding:"10px 0",
                    background:enc===m?T.gd:"transparent",
                    border:`1px solid ${enc===m?T.green:T.b1}`,
                    color:enc===m?T.green:T.muted,
                    fontSize:9,letterSpacing:"0.2em",cursor:"pointer",borderRadius:3,textTransform:"uppercase",
                  }}>
                    <div style={{fontWeight:enc===m?500:400}}>{m}</div>
                    <div style={{fontSize:7,color:enc===m?T.green:T.dim,marginTop:3,letterSpacing:"0.1em"}}>
                      {m===Enc.SVG?"vector · xml embed":"raster · pixel lsb"}
                    </div>
                  </button>
                ))}
              </div>
              <div style={{fontSize:8,color:T.dim,marginTop:6,lineHeight:1.7,letterSpacing:"0.05em"}}>
                {enc===Enc.SVG
                  ?"Payload is hidden in SVG markup. Carriers look like abstract art."
                  :"Payload is hidden in pixel noise. Carriers look like static."}
                {" "}Both parties must use the same mode.
              </div>
            </div>

            {/* TTL */}
            <div>
              <div style={{fontSize:8,color:T.muted,letterSpacing:"0.25em",textTransform:"uppercase",marginBottom:6}}>session TTL (hours)</div>
              <input
                value={ttl} onChange={e=>setTtl(e.target.value)}
                placeholder="4"
                style={{width:"100%",background:T.raised,border:`1px solid ${T.b1}`,color:T.bright,padding:"9px 12px",fontSize:13,outline:"none",borderRadius:3}}
              />
            </div>

            {/* open */}
            <button onClick={open} style={{
              width:"100%",padding:"11px",marginTop:4,
              background:T.gd,border:`1px solid ${T.green}`,
              color:T.green,fontSize:10,letterSpacing:"0.25em",
              cursor:"pointer",borderRadius:3,textTransform:"uppercase",
              transition:"all 0.15s",
            }}>
              open channel →
            </button>

            <div style={{fontSize:8,color:T.dim,lineHeight:1.9,letterSpacing:"0.04em",borderTop:`1px solid ${T.b0}`,paddingTop:12}}>
              Both parties must use the same passphrase and encoding mode.
              Without the passphrase, any carrier is indistinguishable from noise.
              When the session expires or is closed, the key is wiped and all payloads are cleared.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════════════

function App(){
  const [ch,setCh]   = useState(null);
  const [status,setSt] = useState(null);

  useEffect(()=>{
    if(!ch)return;
    setSt(ch.status);
    const u=ch.on("*",()=>setSt(ch.status));
    return()=>u();
  },[ch]);

  const open  = c=>{setCh(c);setSt(c.status);};
  const close = ()=>ch?.close();
  const reset = ()=>{setCh(null);setSt(null);};

  const terminal = status===CS.CLOSED||status===CS.EXPIRED;

  if(!ch||terminal){
    return(
      <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
        {ch&&terminal&&(
          <div style={{
            background:status===CS.EXPIRED?T.rd:T.raised,
            borderBottom:`1px solid ${status===CS.EXPIRED?T.red:T.b0}`,
            padding:"9px 16px",display:"flex",alignItems:"center",gap:8,
            fontSize:9,letterSpacing:"0.2em",flexShrink:0,
          }}>
            <span style={{color:status===CS.EXPIRED?T.red:T.muted,textTransform:"uppercase"}}>
              channel {status} — key wiped
            </span>
            <button onClick={reset} style={{marginLeft:"auto",background:"transparent",border:`1px solid ${T.b1}`,color:T.sub,padding:"3px 10px",fontSize:8,letterSpacing:"0.15em",cursor:"pointer",borderRadius:2}}>
              new channel
            </button>
          </div>
        )}
        <div style={{flex:1,overflow:"hidden"}}>
          <Setup onOpen={open}/>
        </div>
      </div>
    );
  }

  return <ChatView channel={ch} onClose={close}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
