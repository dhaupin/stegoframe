# Stegoframe - Cloudflare Pages Configuration
# https://developers.cloudflare.com/pages/platform/build-configuration/

name = "stegoframe"
compatibility_date = "2025-09-27"
pages_build_output_dir = "."

# Observability (logging, etc)
observability = { enabled = true }

# Compatibility flags
compatibility_flags = ["nodejs_compat"]

# Scheduled trigger — runs every 10 minutes to clean up expired rooms
# Keeps the worker scheduled even on free tier (included in 100K/day limit)
[triggers]
crons = ["*/10 * * * *"]

# KV namespace for rate limiting (optional)
# If not bound, the worker silently skips rate limiting.
#
# To use locally with wrangler dev:
#   1. wrangler kv namespace create stegoframe-rate-limit
#   2. Replace "YOUR_NAMESPACE_ID" below with the returned id
#
# For Cloudflare Pages (production), bind via the dashboard instead:
#   Storage → workers kv → create instance
#   Pages → your project → Settings → Functions → KV namespace bindings
#   Variable name: SF_RL
#
# The id below is only used by `wrangler dev` — Pages ignores it.
[[kv_namespaces]]
binding = "SF_RL"
id = "YOUR_NAMESPACE_ID"
