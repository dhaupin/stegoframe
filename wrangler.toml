# Stegoframe - Cloudflare Pages Configuration
# https://developers.cloudflare.com/pages/platform/build-configuration/

name = "stegoframe"
compatibility_date = "2025-09-27"
pages_build_output_dir = "."

# Observability (logging, etc)
observability = { enabled = true }

# Compatibility flags
compatibility_flags = ["nodejs_compat"]

# Note: Room cleanup uses Supabase pg_cron, not Cloudflare scheduled triggers.
# See README.md for pg_cron setup:
#   select cron.schedule('purge-expired-rooms', '0 3 * * *',
#     $$delete from rooms where expires_at < now()$$);

# KV namespace for rate limiting (optional)
# If not bound, the worker silently skips rate limiting.
#
# For Cloudflare Pages (production), bind via the dashboard:
#   Storage → workers kv → create namespace named "stegoframe"
#   Pages → your project → Settings → Functions → KV namespace bindings
#   Variable name: SF_RL
#
# For local wrangler dev, add to wrangler.toml:
#   [[kv_namespaces]]
#   binding = "SF_RL"
#   id = "YOUR_NAMESPACE_ID"
